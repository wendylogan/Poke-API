<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon API Explorer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="pokeball-icon">⚡</div>
            <h1>Pokémon API Explorer</h1>
            <p class="subtitle">Select a Pokémon to view its details</p>
        </div>

        <!-- Dropdown -->
        <div class="select-wrapper">
            <label for="pokemon-select">Choose a Pokémon</label>
            <select id="pokemon-select">
                <option value="">— Select a Pokémon —</option>
            </select>
        </div>

        <!-- Pokémon Card -->
        <div id="pokemon-card" class="pokemon-card hidden">
            <div class="sprite-container">
                <img id="sprite" class="sprite" src="" alt="Pokémon sprite">
            </div>
            <h2 id="name" class="name">—</h2>
            <div class="details-grid">
                <div class="detail-item">
                    <span class="detail-label">Height</span>
                    <span id="height" class="detail-value">—</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Weight</span>
                    <span id="weight" class="detail-value">—</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Type</span>
                    <span id="type" class="detail-value">—</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Base XP</span>
                    <span id="base-xp" class="detail-value">—</span>
                </div>
            </div>
            <div id="abilities" class="abilities">
                <span class="detail-label">Abilities</span>
                <div id="ability-list" class="ability-list">—</div>
            </div>
        </div>

        <!-- Placeholder -->
        <div id="placeholder" class="placeholder">
            <div class="placeholder-icon">🔍</div>
            <p class="placeholder-text">Select a Pokémon from the dropdown above</p>
            <p class="placeholder-sub">Pokémon data will appear here</p>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading hidden">
            <span class="loading-text">Loading Pokémon data</span>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>Data from <a href="https://pokeapi.co" target="_blank" rel="noreferrer">PokéAPI</a></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
